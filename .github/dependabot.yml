version: 2
updates:
  # Bi-weekly (1st and 15th), matching maturity-refresh.yml's cadence.
  # `interval: weekly` has no native every-other-week option, and cron's
  # day-of-week step values (`* * * * 1/2`) don't mean what they look like —
  # Dependabot runs them weekly, not fortnightly (dependabot-core#12246). The
  # day-of-month field doesn't have that bug, so `1,15 * *` is used instead.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 15
    # Native grouping so a bi-weekly run opens one PR instead of one per
    # dependency — replaces the manual/agent-driven consolidation this repo
    # used to need (see AGENTS.md).
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # @types/vscode is a compatibility pin, not a vulnerability surface: it
      # must stay aligned with engines.vscode (constitution Article I).
      # Raising it is a deliberate minimum-VS-Code-version decision, not a
      # routine bump — see PR #150/#155.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # docs/ is a separate npm project (VitePress site) with its own lockfile,
  # not covered by the root `/` entry above — it needs its own schedule to
  # get security fixes (e.g. the vite/postcss/nanoid transitive CVEs Snyk's
  # weekly scan catches via --all-projects but root `npm audit` never sees).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      docs-npm-dependencies:
        patterns:
          - "*"
