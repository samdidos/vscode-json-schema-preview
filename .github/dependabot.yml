version: 2
updates:
  # Both ecosystems are pinned to a fixed weekly slot so the consolidation
  # routine (Routine "Consolidate Dependabot PRs", Thursdays) has a
  # deterministic window to run in, rather than chasing whenever Dependabot
  # happened to wake up.
  #
  # The limits are deliberately above the number of bumps a normal week
  # produces: when the routine closes the superseded PRs it frees slots, and
  # a limit set to the batch size makes Dependabot immediately open the
  # queued remainder (observed 2026-07-31 — closing 9 PRs refilled 4 within
  # a minute). Those stragglers would then wait a full week for the next
  # run, so the whole batch has to fit in one pass.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 15
    ignore:
      # @types/vscode is a compatibility pin, not a vulnerability surface: it
      # must stay aligned with engines.vscode (constitution Article I).
      # Raising it is a deliberate minimum-VS-Code-version decision, not a
      # routine bump — see PR #150/#155.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
