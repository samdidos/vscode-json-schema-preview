version: 2
updates:
  # Bi-weekly (1st and 15th), matching maturity-refresh.yml's cadence.
  # `interval: weekly` has no native every-other-week option, and cron's
  # day-of-week step values (`* * * * 1/2`) don't mean what they look like —
  # Dependabot runs them weekly, not fortnightly (dependabot-core#12246). The
  # day-of-month field doesn't have that bug, so `1,15 * *` is used instead.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 15
    # Native grouping so a bi-weekly run opens one PR instead of one per
    # dependency — replaces the manual/agent-driven consolidation this repo
    # used to need (see AGENTS.md). Two groups, not one: a bare `groups:`
    # entry defaults to `applies-to: version-updates` (the scheduled runs
    # above) and does NOT cover `security-updates` — the event-triggered PRs
    # Dependabot opens the moment a GitHub Advisory matches an installed
    # dependency, independent of the schedule. Without the second group here,
    # exactly the PRs this repo cares most about consolidating (vulnerability
    # patches) would keep opening individually.
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # @types/vscode is a compatibility pin, not a vulnerability surface: it
      # must stay aligned with engines.vscode (constitution Article I).
      # Raising it is a deliberate minimum-VS-Code-version decision, not a
      # routine bump — see PR #150/#155.
      - dependency-name: "@types/vscode"
      # typescript 7.x isn't installable yet: @typescript-eslint/eslint-plugin
      # (and @typescript-eslint/parser) peer on `typescript@">=4.8.4 <6.1.0"`,
      # so `npm ci` fails with ERESOLVE the instant the major bump lands —
      # every job in CI dies in ~2s before anything runs (PR #220). Only the
      # major version is ignored; 6.x minor/patch bumps still flow normally.
      # Revisit once typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # docs/ is a separate npm project (VitePress site) with its own lockfile,
  # not covered by the root `/` entry above — it needs its own schedule to
  # get security fixes (e.g. the vite/postcss/nanoid transitive CVEs Snyk's
  # weekly scan catches via --all-projects but root `npm audit` never sees).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      docs-npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      docs-npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
