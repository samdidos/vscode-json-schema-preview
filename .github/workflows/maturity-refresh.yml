name: Refresh maturity score & bundle size

# Weekly, refresh the cached OpenSSF Scorecard grade, recompute the maturity
# score + chart, re-sync the README coverage badge, and refresh the
# bundle-size snapshot (S03-SR-18), opening a PR only when something actually
# changed. Scheduled a little after the OpenSSF Scorecard workflow
# (scorecard.yml, Tue 07:20) so the published grade has a chance to update
# first. Also runnable on demand.
#
# Note: PRs opened with the default GITHUB_TOKEN do not themselves trigger
# further workflows (a GitHub anti-loop rule), so CI won't re-run on this PR.
# That's fine — the data was just computed here. Swap in a PAT if you want the
# auto-PR to run CI too.
on:
  # Bi-weekly backstop (1st and 15th), and only when no release has already
  # refreshed these files in the last fortnight — see the `plan` job. Releases
  # are the primary refresh path now, so the periodic run exists to cover
  # quiet stretches, not to be the main clock.
  schedule:
    - cron: '0 9 1,15 * *'
  # The primary path (S14-SR-08): refresh *inside* release-please's own PR so
  # the release ships with its own metrics, rather than trailing a separate
  # catch-up PR behind every release. Same hook and the same reason as
  # refresh-gifs.yml — `pull_request` does not fire for a PR release-please
  # opened with GITHUB_TOKEN, so we hang off the Release Please run instead.
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

# Top-level token is read-only (OSSF Token-Permissions); the write scopes the
# refresh job actually needs are granted at job level only.
permissions:
  contents: read

jobs:
  # Work out *whether* to refresh and *where* the result should land.
  #
  #   mode=release   commit straight onto release-please's open PR branch, so
  #                  the release carries its own metrics and no catch-up PR is
  #                  ever needed. Sibling of refresh-gifs.yml, which commits
  #                  into the same PR from the same trigger.
  #   mode=scheduled the bi-weekly backstop: commit to chore/refresh-repo-metrics
  #                  and open a PR for it.
  #   mode=skip      nothing to do.
  #
  # The scheduled run stands down when a release already refreshed these files
  # inside the last fortnight — with the release path in place that run would
  # otherwise re-open a PR whose only real delta is the `generatedAt` date,
  # which is exactly the churn this job is meant to avoid.
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      branch: ${{ steps.decide.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: "was there a release recently?" is a tag question.
          fetch-depth: 0

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          emit() {
            echo "mode=$1" >> "$GITHUB_OUTPUT"
            echo "branch=${2:-}" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # A failed release run leaves a PR we should not be committing onto.
            if [ "$RUN_CONCLUSION" != "success" ]; then
              echo "Release Please concluded '$RUN_CONCLUSION' — nothing to refresh."
              emit skip
              exit 0
            fi

            # An open release-please PR is what "a release is being prepared"
            # looks like. When there is none, release-please merely had nothing
            # to release (or the release just merged and its PR is closed).
            branch=$(gh pr list --repo "$REPO" --state open --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
            if [ -z "$branch" ]; then
              echo "No open release-please PR — nothing staged to refresh."
              emit skip
            else
              echo "Refreshing into the open release PR: $branch"
              emit release "$branch"
            fi
            exit 0
          fi

          # Scheduled / manual. A release within the fortnight has already
          # committed a full refresh into its own PR, so skip the backstop.
          # Manual dispatch is deliberately exempt: asking for it is the point.
          if [ "$EVENT_NAME" = "schedule" ]; then
            latest=$(git for-each-ref --sort=-creatordate --format='%(creatordate:unix)' 'refs/tags/v*' | head -1)
            if [ -n "$latest" ] && [ "$(( ($(date +%s) - latest) / 86400 ))" -lt 14 ]; then
              echo "A release landed $(( ($(date +%s) - latest) / 86400 ))d ago — it already refreshed these files. Skipping."
              emit skip
              exit 0
            fi
          fi

          echo "$EVENT_NAME run — refreshing onto the backstop branch."
          emit scheduled

  refresh:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch / the release PR branch
      pull-requests: write # open/update the backstop PR
      statuses: write # post a "Repo metrics" status on the release PR
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      TARGET_BRANCH: ${{ needs.plan.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Empty on the scheduled path, which means "the default branch".
          ref: ${{ env.TARGET_BRANCH }}
          # Full history + tags so the DORA metrics (S14) can read the whole
          # release timeline, not just the shallow default clone.
          fetch-depth: 0

      # workflow_run is decoupled from the release PR's own check list, so
      # without this the PR gives no sign a metrics refresh is even running.
      # A commit status makes it show up like any other check (same treatment
      # refresh-gifs.yml gives its "Demo GIFs" status).
      - name: Mark the metrics refresh as pending on the release PR
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending \
            -f context="Repo metrics" \
            -f description="Refreshing maturity score, DORA, and bundle size…" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # DORA delivery metrics are computed from git tags/commits (S14), so a
      # new release changes them — refresh here where the full history is
      # available (fetch-depth: 0 on checkout above is required).
      #
      # On the release path the tag does not exist yet (release-please creates
      # it when its PR merges), so the generator folds in the pending release
      # from package.json + CHANGELOG.md per S14-SR-10. That is what lets the
      # release commit carry metrics that are already correct the moment the
      # tag lands, instead of going stale on the very next push to main.
      #
      # MUST run before the test suite below either way: the S14-SR-08
      # freshness test compares dora.json against the release set, and would
      # otherwise fail before this job reached the step that fixes it.
      - name: Recompute DORA delivery metrics
        run: npm run dora

      # The Testing dimension reads coverage/coverage-summary.json, so the score
      # is only correct after a coverage run.
      - name: Run tests with coverage
        run: npm run test:coverage

      # The one networked step, best-effort. If the API is unreachable or has no
      # published run yet, the script writes nothing and we recompute with
      # whatever cache already exists (or none — the OSSF check simply skips).
      # Failure is swallowed in-shell (not via `continue-on-error:`, which the
      # maturity metric itself flags as a silently-non-blocking job).
      - name: Refresh OpenSSF Scorecard cache (best-effort)
        run: npm run maturity:ossf || echo "OSSF fetch unavailable — recomputing without a fresh grade"

      - name: Recompute maturity score and chart
        run: npm run maturity

      # Coverage ran above, so coverage-summary.json is on disk — refresh the
      # static README coverage badge from it here (and commit it below) so the
      # badge is a pipeline guarantee, not just synced when a Claude Code agent
      # edits package.json. Best-effort: a missing summary leaves it untouched.
      - name: Sync README coverage badge
        run: npm run badges:sync

      # Build size budget check (S03-SR-15..S03-SR-18) — the snapshot this
      # writes (bundle-size.json) is what gives the size trend a git history,
      # independent of whether any PR happened to touch dist/ this week.
      - name: Refresh bundle-size snapshot
        run: npm run package && npm run check:bundle-size

      - name: Commit the refreshed metrics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add maturity-score.json MATURITY.md README.md docs/public/maturity-scorecard-light.svg docs/public/maturity-scorecard-dark.svg bundle-size.json dora.json
          [ -f ossf-scorecard.json ] && git add ossf-scorecard.json

          # --staged so newly-created files (a first-ever OSSF cache) count too.
          if git diff --staged --quiet; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$MODE" = "release" ]; then
            # Straight onto release-please's branch, so the release ships with
            # its own metrics. No force-push: refresh-gifs.yml is committing to
            # this same branch concurrently, and clobbering its GIF commit would
            # silently undo it.
            git commit --no-verify -m "chore: refresh repo metrics for the release"
            git push origin "HEAD:$TARGET_BRANCH"
            exit 0
          fi

          BRANCH=chore/refresh-repo-metrics
          git checkout -B "$BRANCH"
          # Data-only change; the verify gate already ran above, so skip the hook.
          git commit --no-verify -m "chore: refresh maturity score, OpenSSF grade, and bundle size"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // ""')" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "chore: refresh maturity score, OpenSSF grade, README badge, and bundle size" \
              --body "Bi-weekly backstop refresh of the maturity score, the OpenSSF Scorecard cache, the scorecard chart, the README coverage badge, and the bundle-size snapshot (S03-SR-18), generated by \`.github/workflows/maturity-refresh.yml\`. Releases refresh these files in their own PR, so this runs only when no release has landed in the last fortnight. Review the deltas and merge if they look right."
          else
            echo "An open refresh PR already exists — it has been updated by the force-push."
          fi

      # Mirrors refresh-gifs.yml: report the outcome back onto the release PR,
      # which cannot see this workflow_run-triggered job otherwise.
      - name: Mark the metrics refresh as successful
        if: success() && env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context="Repo metrics" \
            -f description="Repo metrics refreshed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark the metrics refresh as failed
        if: failure() && env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ env.START_SHA }}" \
            -f state=failure \
            -f context="Repo metrics" \
            -f description="Repo metrics failed to refresh — see the workflow run for details" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
