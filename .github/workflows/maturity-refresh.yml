name: Refresh maturity score & bundle size

# Weekly, refresh the cached OpenSSF Scorecard grade, recompute the maturity
# score + chart, re-sync the README coverage badge, and refresh the
# bundle-size snapshot (S03-SR-18), opening a PR only when something actually
# changed. Scheduled a little after the OpenSSF Scorecard workflow
# (scorecard.yml, Tue 07:20) so the published grade has a chance to update
# first. Also runnable on demand.
#
# Note: PRs opened with the default GITHUB_TOKEN do not themselves trigger
# further workflows (a GitHub anti-loop rule), so CI won't re-run on this PR.
# That's fine — the data was just computed here. Swap in a PAT if you want the
# auto-PR to run CI too.
on:
  schedule:
    - cron: '0 9 * * 2'
  # Also after every release (S14-SR-08). The DORA metrics are a pure function
  # of the release-tag set, so a new tag is the one moment dora.json can go
  # stale — and releases land far more often than this weekly cron, which left
  # the published Delivery view three releases behind.
  #
  # Note this fires on *every* Release Please run, i.e. every push to main —
  # the run succeeds whether it cut a release or merely opened/updated its
  # release PR. The `gate` job below narrows that back down to actual
  # releases; see the comment there.
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

# Top-level token is read-only (OSSF Token-Permissions); the write scopes the
# refresh job actually needs are granted at job level only.
permissions:
  contents: read

jobs:
  # Decide whether this run should refresh anything at all.
  #
  # Release Please runs on every push to main and reports success either way:
  # the common case is that it just opened or updated its pending release PR
  # and cut nothing. Keying the refresh off that alone turned a deliberately
  # weekly job into a near-every-merge one, opening a fresh metrics PR whose
  # only real delta was the `generatedAt` date. S14-SR-08 asks for a refresh
  # "when a release happens", and a release is observable: release-please
  # tags the released commit. So require a `v*` tag on the very commit
  # Release Please ran against. Schedule and manual runs stay unconditional.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the tag we are testing for is the whole point.
          fetch-depth: 0

      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "$EVENT_NAME run — refreshing unconditionally."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed release produced no tag, so there is nothing new to compute.
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Release Please concluded '$RUN_CONCLUSION' — nothing to refresh."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$(git tag --points-at "$RUN_HEAD_SHA" --list 'v*')" ]; then
            echo "Release tag found on $RUN_HEAD_SHA — refreshing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release tag on $RUN_HEAD_SHA — Release Please only updated"
            echo "its release PR, so the release-tag set is unchanged. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open/update the refresh PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + tags so the DORA metrics (S14) can read the whole
          # release timeline, not just the shallow default clone.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # DORA delivery metrics are computed from git tags/commits (S14), so a
      # new release since last week changes them — refresh here where the full
      # history is available (fetch-depth: 0 on checkout above is required).
      # This MUST run before the test suite below: this job is triggered
      # right after a release tags, so the checkout already sees the new tag
      # while the committed dora.json doesn't yet — the S14-SR-08 freshness
      # test would otherwise fail every single time a release lands, before
      # this job ever reached the step that fixes it.
      - name: Recompute DORA delivery metrics
        run: npm run dora

      # The Testing dimension reads coverage/coverage-summary.json, so the score
      # is only correct after a coverage run.
      - name: Run tests with coverage
        run: npm run test:coverage

      # The one networked step, best-effort. If the API is unreachable or has no
      # published run yet, the script writes nothing and we recompute with
      # whatever cache already exists (or none — the OSSF check simply skips).
      # Failure is swallowed in-shell (not via `continue-on-error:`, which the
      # maturity metric itself flags as a silently-non-blocking job).
      - name: Refresh OpenSSF Scorecard cache (best-effort)
        run: npm run maturity:ossf || echo "OSSF fetch unavailable — recomputing without a fresh grade"

      - name: Recompute maturity score and chart
        run: npm run maturity

      # Coverage ran above, so coverage-summary.json is on disk — refresh the
      # static README coverage badge from it here (and commit it below) so the
      # badge is a pipeline guarantee, not just synced when a Claude Code agent
      # edits package.json. Best-effort: a missing summary leaves it untouched.
      - name: Sync README coverage badge
        run: npm run badges:sync

      # Build size budget check (S03-SR-15..S03-SR-18) — the snapshot this
      # writes (bundle-size.json) is what gives the size trend a git history,
      # independent of whether any PR happened to touch dist/ this week.
      - name: Refresh bundle-size snapshot
        run: npm run package && npm run check:bundle-size

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add maturity-score.json MATURITY.md README.md docs/public/maturity-scorecard-light.svg docs/public/maturity-scorecard-dark.svg bundle-size.json dora.json
          [ -f ossf-scorecard.json ] && git add ossf-scorecard.json

          # --staged so newly-created files (a first-ever OSSF cache) count too.
          if git diff --staged --quiet; then
            echo "Nothing changed — nothing to open."
            exit 0
          fi

          BRANCH=chore/refresh-repo-metrics
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # Data-only change; the verify gate already ran above, so skip the hook.
          git commit --no-verify -m "chore: refresh maturity score, OpenSSF grade, and bundle size"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number // ""')" ]; then
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "chore: refresh maturity score, OpenSSF grade, README badge, and bundle size" \
              --body "Automated weekly refresh of the maturity score, the OpenSSF Scorecard cache, the scorecard chart, the README coverage badge, and the bundle-size snapshot (S03-SR-18), generated by \`.github/workflows/maturity-refresh.yml\`. Review the deltas and merge if they look right."
          else
            echo "An open refresh PR already exists — it has been updated by the force-push."
          fi
