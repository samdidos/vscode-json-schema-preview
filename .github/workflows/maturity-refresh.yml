name: Refresh repo metrics

# Refreshes the OpenSSF Scorecard cache, maturity score, DORA metrics, README
# coverage badge, and bundle-size snapshot (S03-SR-18) into ONE standing PR:
# each artefact is skipped when it isn't due (see the `due` helper below), and
# every run force-pushes the same branch and reuses the open PR if there is
# one — that's what keeps this from becoming a stream of one-off PRs.
#
# scorecard.yml, codeql.yml and snyk.yml are NOT folded in here even though
# they're also periodic: scorecard.yml's presence earns points in the
# maturity score itself and also runs on push/branch_protection_rule, which
# don't belong on this clock; codeql.yml/snyk.yml raise alerts rather than
# committing files, so they never contributed to the PR noise this fixes.
on:
  # Bi-weekly backstop. The per-artefact `due` checks below are what actually
  # keep the PR quiet; this cadence just bounds how stale things can get.
  schedule:
    - cron: '0 9 1,15 * *'
  # dora.json is a function of the release-tag set (S14-SR-08), so a release
  # is the one moment it can go stale — this runs after Release Please has
  # tagged, so the tag is already visible.
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

# Top-level token is read-only (OSSF Token-Permissions); write scopes are
# granted at job level only.
permissions:
  contents: read

jobs:
  # Release Please succeeds on every push to main whether or not it cut a
  # release, so gate on the tag it leaves rather than on that success alone.
  # The scheduled run additionally stands down if a release refreshed
  # everything within the last fortnight.
  plan:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every question below is a tag question

      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_CONCLUSION" != "success" ]; then
              echo "Release Please concluded '$RUN_CONCLUSION' — nothing to refresh."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$(git tag --points-at "$RUN_HEAD_SHA" --list 'v*')" ]; then
              echo "No release tag on $RUN_HEAD_SHA — only the release PR was updated. Skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release tag found on $RUN_HEAD_SHA — dora.json needs recomputing."
          elif [ "$EVENT_NAME" = "schedule" ]; then
            latest=$(git for-each-ref --sort=-creatordate --format='%(creatordate:unix)' 'refs/tags/v*' | head -1)
            if [ -n "$latest" ] && [ "$(( ($(date +%s) - latest) / 86400 ))" -lt 14 ]; then
              echo "A release landed $(( ($(date +%s) - latest) / 86400 ))d ago and refreshed these files. Skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the standing refresh branch
      pull-requests: write # open/update the standing refresh PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # DORA (S14) needs the full release-tag history

      # `due <file> <field>` is true when the file is missing or its recorded
      # date is 14+ days old. dora.json is the exception — it's checked
      # against the tags themselves (`dora:check`), not elapsed time.
      - name: Decide which artefacts are due
        id: due
        run: |
          set -euo pipefail

          due() {
            [ -f "$1" ] || return 0
            stamped=$(node -p "JSON.parse(require('fs').readFileSync('$1','utf8')).$2 || ''")
            [ -n "$stamped" ] || return 0
            [ "$(( ($(date +%s) - $(date -d "$stamped" +%s)) / 86400 ))" -ge 14 ]
          }

          if due ossf-scorecard.json fetchedAt; then echo "ossf=true" >> "$GITHUB_OUTPUT"; else echo "ossf=false" >> "$GITHUB_OUTPUT"; fi
          if due maturity-score.json generatedAt; then echo "maturity=true" >> "$GITHUB_OUTPUT"; else echo "maturity=false" >> "$GITHUB_OUTPUT"; fi
          if due bundle-size.json generatedAt; then echo "bundle=true" >> "$GITHUB_OUTPUT"; else echo "bundle=false" >> "$GITHUB_OUTPUT"; fi

          # S14-SR-09: refuses to judge a checkout with no tags visible —
          # fetch-depth: 0 above means we do have them.
          if npm run --silent dora:check >/dev/null 2>&1; then
            echo "dora=false" >> "$GITHUB_OUTPUT"
          else
            echo "dora=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Tags only (S14-SR-06), never package.json's version — on a release PR
      # that's bumped ahead of tagging, so dating from it would make every
      # derived figure an estimate. MUST run before the coverage step below:
      # the S14-SR-08 freshness test compares dora.json against the tags.
      - name: Recompute DORA delivery metrics
        if: steps.due.outputs.dora == 'true'
        run: npm run dora

      # Best-effort: scorecard.yml publishes the grade on every push to main,
      # so this only needs its own fortnightly cadence to stay current.
      - name: Refresh OpenSSF Scorecard cache (best-effort)
        if: steps.due.outputs.ossf == 'true'
        run: npm run maturity:ossf || echo "OSSF fetch unavailable — recomputing without a fresh grade"

      # Needed whenever the score or the OSSF grade is due — the score reads
      # coverage, and the badge below reads the same summary.
      - name: Run tests with coverage
        if: steps.due.outputs.maturity == 'true' || steps.due.outputs.ossf == 'true'
        run: npm run test:coverage

      - name: Recompute maturity score and chart
        if: steps.due.outputs.maturity == 'true' || steps.due.outputs.ossf == 'true'
        run: npm run maturity

      - name: Sync README coverage badge
        if: steps.due.outputs.maturity == 'true' || steps.due.outputs.ossf == 'true'
        run: npm run badges:sync

      - name: Refresh bundle-size snapshot
        if: steps.due.outputs.bundle == 'true'
        run: npm run package && npm run check:bundle-size

      - name: Commit the refreshed metrics into the standing PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -- maturity-score.json MATURITY.md README.md docs/public/maturity-scorecard-light.svg docs/public/maturity-scorecard-dark.svg bundle-size.json dora.json
          [ -f ossf-scorecard.json ] && git add -- ossf-scorecard.json

          if git diff --staged --quiet; then
            echo "Nothing was due — no commit, no PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH=chore/refresh-repo-metrics
          git checkout -B "$BRANCH"
          # Bot-authored data commit; skip the local pre-commit hook.
          git commit --no-verify -m "chore: refresh repo metrics"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // ""')" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "chore: refresh repo metrics" \
              --body "Refreshes the repo's generated metrics — the maturity score and chart, the cached OpenSSF Scorecard grade, the DORA delivery snapshot, the README coverage badge, and the bundle-size snapshot (S03-SR-18) — from \`.github/workflows/maturity-refresh.yml\`.

          Runs bi-weekly, plus once after each release (a new tag is the only thing that can make \`dora.json\` stale, S14-SR-08). Each artefact is refreshed only when it is actually due, so this PR should contain real deltas rather than regenerated date stamps. Everything lands on one standing branch, so this PR is updated in place rather than replaced.

          Review the deltas and merge if they look right."
          else
            echo "The standing refresh PR already exists — updated by the force-push."
          fi
