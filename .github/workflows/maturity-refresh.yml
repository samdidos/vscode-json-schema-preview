name: Refresh maturity score

# Weekly, refresh the cached OpenSSF Scorecard grade and recompute the maturity
# score + chart, opening a PR only when something actually changed. Scheduled a
# little after the OpenSSF Scorecard workflow (scorecard.yml, Tue 07:20) so the
# published grade has a chance to update first. Also runnable on demand.
#
# Note: PRs opened with the default GITHUB_TOKEN do not themselves trigger
# further workflows (a GitHub anti-loop rule), so CI won't re-run on this PR.
# That's fine — the data was just computed here. Swap in a PAT if you want the
# auto-PR to run CI too.
on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The Testing dimension reads coverage/coverage-summary.json, so the score
      # is only correct after a coverage run.
      - name: Run tests with coverage
        run: npm run test:coverage

      # The one networked step, best-effort. If the API is unreachable or has no
      # published run yet, the script writes nothing and we recompute with
      # whatever cache already exists (or none — the OSSF check simply skips).
      # Failure is swallowed in-shell (not via `continue-on-error:`, which the
      # maturity metric itself flags as a silently-non-blocking job).
      - name: Refresh OpenSSF Scorecard cache (best-effort)
        run: npm run maturity:ossf || echo "OSSF fetch unavailable — recomputing without a fresh grade"

      - name: Recompute maturity score and chart
        run: npm run maturity

      - name: Open a PR if the score changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add maturity-score.json docs/public/maturity-scorecard-light.svg docs/public/maturity-scorecard-dark.svg
          [ -f ossf-scorecard.json ] && git add ossf-scorecard.json

          # --staged so newly-created files (a first-ever OSSF cache) count too.
          if git diff --staged --quiet; then
            echo "Maturity score unchanged — nothing to open."
            exit 0
          fi

          BRANCH=chore/refresh-maturity-score
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # Data-only change; the verify gate already ran above, so skip the hook.
          git commit --no-verify -m "chore: refresh maturity score and OpenSSF grade"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number // ""')" ]; then
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "chore: refresh maturity score and OpenSSF grade" \
              --body "Automated weekly refresh of the maturity score, the OpenSSF Scorecard cache, and the scorecard chart, generated by \`.github/workflows/maturity-refresh.yml\`. Review the score delta and merge if it looks right."
          else
            echo "An open refresh PR already exists — it has been updated by the force-push."
          fi
