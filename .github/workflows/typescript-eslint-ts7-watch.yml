name: Watch typescript-eslint for TS7 support

# Dependabot ignores typescript's major-version bumps (.github/dependabot.yml)
# because @typescript-eslint/eslint-plugin and @typescript-eslint/parser peer
# on typescript@">=4.8.4 <6.1.0", which excludes TypeScript 7 outright — see
# PR #220. That ignore rule is silent by design: nothing tells us when the
# blocker clears. This workflow runs scripts/check-ts7-eslint-support.mjs on
# the same bi-weekly cadence as dependabot.yml and opens exactly one tracking
# issue the moment both packages' peer ranges start allowing TS 7 — nothing
# on every other run, so it never becomes noise.
on:
  schedule:
    - cron: '0 7 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write # only for opening the one tracking issue below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check typescript-eslint's TS7 peer support
        id: check
        run: npm run check:ts7-eslint-support

      - name: Open a tracking issue if support just landed
        if: steps.check.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TITLE="typescript-eslint now supports TypeScript 7"

          if [ -n "$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')" ]; then
            echo "Tracking issue already open — nothing to do."
            exit 0
          fi

          # shellcheck disable=SC2016 # single-quoted on purpose: these backticks are literal markdown code spans for the issue body, not command substitution.
          BODY='`scripts/check-ts7-eslint-support.mjs` reports that `@typescript-eslint/eslint-plugin` and `@typescript-eslint/parser` — their latest published peer ranges now both allow TypeScript 7.

          Time to revisit the `typescript` major-version ignore rule in `.github/dependabot.yml` (added in PR #220): remove the `- dependency-name: "typescript"` ignore entry, let Dependabot open the bump PR again, and confirm `npm ci` resolves cleanly before merging.

          This issue was opened automatically by `.github/workflows/typescript-eslint-ts7-watch.yml`.'

          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
