name: Publish to MCP Registry

# Lists a CLI release in the official MCP Registry (F33-FR-18) as
# io.github.samdidos/json-schema-toolkit, from cli/server.json.
#
# Run by hand ("Run workflow") once the version is live on npm. publish-cli.yml
# only stages the CLI; a maintainer approves it with 2FA (S21-SR-06), and the
# registry refuses a version npm does not serve yet. The run checks out the
# `cli-v<version>` tag publish-cli.yml created when it staged that version, and
# fails with a reminder if the version is not live yet.
#
# Logs in with GitHub OIDC: the registry grants io.github.samdidos/* to
# workflows in samdidos/* repositories, so no registry secret is stored. No
# GitHub environment: npm's trusted publisher only accepts the `npm`
# environment, so this job's OIDC token cannot stage or publish to npm.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version to list, e.g. 0.22.0 (must be approved and live on npm)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token mcp-publisher exchanges for io.github.samdidos/*
    env:
      VERSION: ${{ inputs.version }}
      # The official publisher from modelcontextprotocol/registry releases. Bump
      # deliberately; never fetch `latest` or run a publisher via npx — the
      # unscoped npm name `mcp-publisher` belongs to an unrelated project.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Validate the version input
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.2.3, got '${VERSION}'." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/cli-v${{ inputs.version }}

      - name: Check server.json and npm agree on the version
        run: |
          manifest="$(node -p "require('./cli/server.json').version")"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::cli/server.json at cli-v${VERSION} is version ${manifest}." >&2
            exit 1
          fi
          live="$(npm view "json-schema-toolkit@${VERSION}" mcpName 2>/dev/null || true)"
          expected="$(node -p "require('./cli/server.json').name")"
          if [ "$live" != "$expected" ]; then
            echo "::error::json-schema-toolkit@${VERSION} is not live on npm with mcpName ${expected} (got '${live}'). Approve the staged version on npmjs.com (json-schema-toolkit → Staged) or with \`npm stage approve <stage-id>\`, then run this workflow again." >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish cli/server.json to the MCP Registry
        working-directory: cli
        run: ../mcp-publisher publish
