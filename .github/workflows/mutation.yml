name: Mutation testing

# Stryker measures whether the tests would actually catch a regression (a
# stronger signal than line coverage) by re-running them against thousands of
# mutations. Slow, so it runs on demand and weekly rather than on every push —
# stryker.config.json's break threshold still gates it as a real signal,
# just without adding its runtime to every PR's required checks.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0' # Sundays, 04:00 UTC

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run Stryker mutation tests
        run: npm run test:mutation

      # Without this the score would only ever be refreshed by hand, and a
      # committed mutation-score.json would quietly rot (S18-SR-03 makes the
      # staleness visible; this keeps it from happening).
      - name: Publish the mutation score
        if: always()
        run: npm run mutation:score

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

      - name: Upload the published score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-score
          path: mutation-score.json
          retention-days: 90
