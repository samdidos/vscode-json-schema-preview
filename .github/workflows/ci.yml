name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect source-relevant changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Diff against base
        id: filter
        # Path set + diff logic live in scripts/ci-detect-source-changes.sh
        # (S09-SR-02/S09-NFR-02) so ci.yml and codeql.yml share exactly one
        # definition instead of duplicating the pattern. This job always runs
        # (no path filter on the workflow trigger itself) and only gates work
        # via job-level `if:` on its output — a workflow-level `paths-ignore`
        # would instead make the whole workflow (and any required status
        # check depending on it) never start on a docs-only PR, which GitHub
        # then shows as permanently "Expected — Waiting" rather than passing
        # (S09-SR-03).
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-detect-source-changes.sh

  traceability:
    name: Spec & doc traceability
    runs-on: ubuntu-latest
    # Deliberately unconditional (S09-SR-01): these are the checks most likely
    # to matter on exactly the PRs the `changes` filter above would otherwise
    # skip (spec/traceability.json/docs-only edits), and they're cheap plain-
    # Node scripts with no npm install needed.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Spec traceability (no spec/matrix/test drift)
        run: npm run check:traceability

      - name: Documentation traceability (no stale doc tags)
        run: npm run check:doc-traceability

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension bundle
        run: npm run compile

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Maturity score is current
        # Recomputes the scorecard from repo facts (coverage now exists from the
        # step above) and warns if the committed maturity-score.json is stale.
        # Non-blocking (continue-on-error): drift here is a prompt to re-run
        # `npm run maturity` locally, not a reason to fail the build.
        continue-on-error: true
        run: npm run maturity:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

  security:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  knip:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    # The backlog was cleared (see d364f60); this now gates merges like any
    # other check instead of only reporting.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Knip (unused files, exports, dependencies)
        run: npm run knip

  integration:
    name: Integration tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    # S08 — real VS Code via @vscode/test-electron, per S08-SR-08/09. Runs
    # non-blocking (continue-on-error) while flakiness is measured; promote to
    # a required check only after 2 consecutive clean weeks (S08-SR-08), and
    # record the promotion in specs/S08-e2e-testing.md's History.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Integration tests (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
