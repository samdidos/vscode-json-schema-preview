name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default (OpenSSF Token-Permissions): no job here writes.
permissions:
  contents: read

jobs:
  changes:
    name: Detect source-relevant changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff against base
        id: filter
        # Shared with codeql.yml (S09-SR-02/NFR-02): scripts/ci-detect-source-changes.sh.
        # Gated via job-level `if:` on this output, not a workflow-level
        # `paths-ignore` — the latter leaves a docs-only PR's required checks
        # permanently "Expected — Waiting" instead of passing (S09-SR-03).
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-detect-source-changes.sh

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    # Always runs, unlike the `changes`-gated jobs below (S09-SR-05): a broken
    # workflow can land on a PR that never touches source. Container image
    # tag rather than a `uses:` action, so it's not part of the SHA-pin ledger.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: -color

  traceability:
    name: Spec & doc traceability
    runs-on: ubuntu-latest
    # Deliberately unconditional (S09-SR-01): these are the checks most likely
    # to matter on exactly the PRs the `changes` filter above would otherwise
    # skip (spec/traceability.json/docs-only edits), and they're cheap plain-
    # Node scripts with no npm install needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Spec traceability (no spec/matrix/test drift)
        run: npm run check:traceability

      - name: Documentation traceability (no stale doc tags)
        run: npm run check:doc-traceability

      - name: Coverage/mutation exclusion consistency
        run: npm run check:consistency

      - name: Spec effort estimates valid against the S13 rubric
        run: npm run check:spec-effort

      - name: Feature value estimates valid against the S16 rubric
        run: npm run check:spec-value

  # Each of lint/type-check/compile/bundle-size/coverage/audit is independent
  # of the others, so each is its own job fanning out from `changes` in
  # parallel (S09-SR-02) rather than sharing one runner's wall-clock time.
  # coverage keeps maturity:check as a second step since that reads
  # coverage-summary.json from the step before it.

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type check
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run type-check

  compile:
    name: Build extension bundle
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run compile

  bundle-size:
    name: Build size budget (S03-SR-15..S03-SR-18)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run package && npm run check:bundle-size

  coverage:
    name: Tests, coverage & maturity score
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags (S14-SR-08/09): doraFreshness.test.ts compares
          # dora.json against the latest visible release tag, which a shallow
          # checkout (actions/checkout's default) would hide entirely.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Maturity scorer is healthy
        # Blocking, but asymmetric (S12-SR-16): fails only when the scorer is
        # broken (unreadable artifact, or a check probing a path that no
        # longer exists) — a score that merely moved warns and passes, since
        # it changes with coverage and every requirement added.
        run: npm run maturity:check

  audit:
    name: Audit dependencies
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run check:audit

  security:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  knip:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Knip (unused files, exports, dependencies)
        run: npm run knip

  integration:
    name: Integration tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    # Real VS Code via @vscode/test-electron (S08-SR-08/09). Non-blocking
    # while flakiness is measured — via branch protection, not
    # `continue-on-error` (S09-SR-08), so a red run still shows red. Promote
    # to a required check after 2 consecutive clean weeks (specs/S08-e2e-testing.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Integration tests (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  docs:
    name: Docs site build & audit
    needs: changes
    # docs/ is a separate npm project (own package.json/package-lock.json),
    # not covered by any src-scoped job above nor by root's `npm audit`
    # (S09-SR-09). Scoped to docs/** the same way the src-scoped jobs are
    # scoped to SR-02's path set (S09-SR-10), via the `changes` job's `docs`
    # output rather than a workflow-level path trigger, for the reason
    # S09-SR-03 gives for `src`.
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci --prefix docs
      - run: npm run build --prefix docs
      - run: npm run check:docs-audit
