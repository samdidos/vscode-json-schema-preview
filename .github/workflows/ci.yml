name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension bundle
        run: npm run compile

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Maturity score is current
        # Recomputes the scorecard from repo facts (coverage now exists from the
        # step above) and warns if the committed maturity-score.json is stale.
        # Non-blocking (continue-on-error): drift here is a prompt to re-run
        # `npm run maturity` locally, not a reason to fail the build.
        continue-on-error: true
        run: npm run maturity:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  knip:
    runs-on: ubuntu-latest
    # The backlog was cleared (see d364f60); this now gates merges like any
    # other check instead of only reporting.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Knip (unused files, exports, dependencies)
        run: npm run knip

  integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # S08 — real VS Code via @vscode/test-electron, per S08-SR-08/09. Runs
    # non-blocking (continue-on-error) while flakiness is measured; promote to
    # a required check only after 2 consecutive clean weeks (S08-SR-08), and
    # record the promotion in specs/S08-e2e-testing.md's History.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Integration tests (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
