name: Refresh Demo GIFs

# pull_request: opened/reopened does NOT fire when release-please creates its PR
# via GITHUB_TOKEN (GitHub blocks cascading workflow triggers to prevent loops).
# workflow_run fires after the Release Please workflow itself completes, which is
# the correct hook regardless of which token release-please used internally.
on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit refreshed GIFs onto'
        required: false
        default: 'release-please--branches--main--components--json-schema-preview'

# Top-level token is read-only (OSSF Token-Permissions); write scopes are
# granted only to the job that pushes the refreshed GIFs.
permissions:
  contents: read

jobs:
  find-pr:
    # Skip if release-please itself failed (no point refreshing a broken PR).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - name: Resolve target branch
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            branch=$(gh pr list \
              --repo ${{ github.repository }} \
              --state open \
              --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

  # S08-SR-12/13 — determines which demos need re-running: the specs that
  # changed or were newly added since the previous release tag, cross-
  # referenced against scripts/demo-registry.mjs. Needs the full tag history
  # (fetch-depth: 0), so it's a separate job rather than a step reused by
  # both consumers below.
  detect-features:
    needs: find-pr
    if: needs.find-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.features.outputs.all }}
      demos: ${{ steps.features.outputs.demos }}
      mouse-grep: ${{ steps.features.outputs.mouse-grep }}
      smoke-grep: ${{ steps.features.outputs.smoke-grep }}
      changed-specs: ${{ steps.features.outputs.changed-specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.find-pr.outputs.branch }}
          fetch-depth: 0 # need every tag reachable from HEAD, not just the tip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Detect changed/new feature specs since the previous release
        id: features
        run: node scripts/detect-changed-features.mjs

  refresh-gifs:
    needs: [find-pr, detect-features]
    # Skip entirely if there is no open release-please PR (e.g. the release was
    # just merged — release-please closes the PR and won't have a new one yet).
    if: needs.find-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push refreshed GIFs onto the release-please branch
      statuses: write # post a "Demo GIFs" status on the release-please PR's head commit

    env:
      TARGET_BRANCH: ${{ needs.find-pr.outputs.branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run is decoupled from the release-please PR's own check list, so
      # without this the PR shows no indication a GIF refresh is running at all.
      # Posting a commit status makes it appear like any other check — pending
      # now, success/failure once the job finishes below.
      - name: Mark GIF refresh as pending on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending \
            -f context="Demo GIFs" \
            -f description="Regenerating demo GIFs…" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # canvas (used by make-gifs.mjs) ships prebuilt binaries but falls back to
      # building from source when no prebuilt matches — install system headers so
      # the build succeeds in that case. ffmpeg/xdotool are for demo-showcase-mouse
      # only: it records the real X11 display instead of stitching screenshots
      # (see helpers/recorder.ts, helpers/realCursor.ts, make-showcase-gif.mjs).
      - name: Install system libraries for canvas, ffmpeg, xdotool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ffmpeg xdotool

      # The extension's preview feature shells out to json-schema-for-humans.
      - name: Install Python preview renderer
        run: pip3 install json-schema-for-humans

      # VS Code (Electron) needs a display on Linux.
      - name: Start virtual display
        run: /usr/bin/Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

      - name: Build extension
        run: npm run compile

      - name: Run E2E tests (capture screenshot frames + showcase recording)
        env:
          DISPLAY: ':99.0'
          ALL: ${{ needs.detect-features.outputs.all }}
          MOUSE_GREP: ${{ needs.detect-features.outputs.mouse-grep }}
        # Only the mouse demos feed GIFs (make-gifs.mjs consumes the *-mouse
        # frame dirs, make-showcase-gif.mjs consumes videos/showcase.mp4); the
        # non-mouse twins run as CI UI-smoke instead (ci.yml e2e-smoke,
        # S08-SR-11), so don't run them here. S08-SR-12: only the demos mapped
        # to specs that changed/were added since the previous release run —
        # `detect-features` falls back to "mouse" (every mouse demo) when no
        # previous release tag was resolvable.
        run: |
          if [ "$ALL" = "true" ]; then
            GREP='mouse'
          else
            GREP="$MOUSE_GREP"
          fi
          if [ -z "$GREP" ]; then
            echo "No changed/new feature specs since the previous release — skipping demo capture."
          else
            npx playwright test --config playwright.e2e.config.ts --grep "$GREP"
          fi

      # Failure screenshots/error context and the raw showcase recording —
      # without these a demo timeout is just an opaque TimeoutError in the log.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-results
          path: |
            test-results/
            videos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate demo GIFs
        env:
          ALL: ${{ needs.detect-features.outputs.all }}
          DEMOS: ${{ needs.detect-features.outputs.demos }}
        # `showcase` (no `dir` in scripts/demo-registry.mjs) is excluded here —
        # it's produced by the next step instead.
        run: |
          if [ "$ALL" = "true" ]; then
            node scripts/make-gifs.mjs
          elif [ -n "$DEMOS" ]; then
            node scripts/make-gifs.mjs --demos "$DEMOS"
          else
            echo "No demo GIFs need refreshing."
          fi

      - name: Generate showcase GIF from the screen recording
        if: needs.detect-features.outputs.all == 'true' || contains(needs.detect-features.outputs.demos, 'showcase')
        run: node scripts/make-showcase-gif.mjs

      - name: Commit and push refreshed GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/demo-*.gif
          git diff --staged --quiet || git commit -m "chore: refresh demo GIFs"
          git push origin HEAD:${{ env.TARGET_BRANCH }}

      # Reached only if every prior step succeeded. HEAD is now whatever the PR's
      # current tip actually is — the new GIF-refresh commit if one was pushed,
      # or unchanged if the GIFs came out byte-identical and nothing was committed.
      - name: Mark GIF refresh as successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context="Demo GIFs" \
            -f description="Demo GIFs refreshed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Reached if any prior step failed. No GIF commit happens in that case, so
      # the PR's head is still the original commit captured before the run.
      - name: Mark GIF refresh as failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ env.START_SHA }}" \
            -f state=failure \
            -f context="Demo GIFs" \
            -f description="Demo GIFs failed to regenerate — see the workflow run for details" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  e2e-smoke:
    name: E2E UI smoke (Playwright, command-palette demos)
    needs: [find-pr, detect-features]
    # Sibling of refresh-gifs (both need only find-pr/detect-features, not each
    # other) so the two run concurrently instead of one lengthening the
    # other's critical path.
    if: needs.find-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    # S08-SR-10/11 — the command-palette (non-mouse) demo scripts run the real
    # feature flows through the actual VS Code UI. No assertions: this is
    # crash / broken-selector detection, so it passes when every demo completes
    # without throwing or timing out. Previously ran in ci.yml on every PR/push,
    # but the ~6-minute run was contending for shared runner capacity alongside
    # a dozen other PR jobs, which manifested as spurious Quick-Open-search
    # timeouts rather than real failures. Moved to the same release cadence as
    # the GIF refresh it shares fixtures with. Non-blocking while flakiness is
    # measured — but this workflow runs after a release, not on a pull request,
    # so it cannot block a merge anyway; swallowing the result with
    # `continue-on-error` would buy nothing and destroy the only signal the
    # job exists to produce (S09-SR-08). S08-SR-12: only the demos mapped to
    # specs that changed/were added since the previous release run — falls back
    # to every non-mouse demo (`--grep-invert mouse`) when no previous release
    # tag was resolvable.

    env:
      TARGET_BRANCH: ${{ needs.find-pr.outputs.branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The preview demo renders with json-schema-for-humans when present
      # (otherwise it falls back to the built-in renderer); install it so the
      # smoke run matches the GIF-refresh environment.
      - name: Install Python renderer
        run: pip3 install json-schema-for-humans

      - name: Build extension bundle
        run: npm run compile

      - name: Start virtual display
        run: /usr/bin/Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

      - name: Run command-palette demo flows (no mouse twins)
        env:
          DISPLAY: ':99.0'
          ALL: ${{ needs.detect-features.outputs.all }}
          SMOKE_GREP: ${{ needs.detect-features.outputs.smoke-grep }}
        run: |
          if [ "$ALL" = "true" ]; then
            npx playwright test --config playwright.e2e.config.ts --grep-invert mouse
          elif [ -n "$SMOKE_GREP" ]; then
            npx playwright test --config playwright.e2e.config.ts --grep "$SMOKE_GREP"
          else
            echo "No changed/new feature specs since the previous release — skipping UI smoke."
          fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
