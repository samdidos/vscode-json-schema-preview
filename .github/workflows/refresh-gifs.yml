name: Refresh Demo GIFs

# workflow_run, not pull_request: a PR opened by release-please's own
# GITHUB_TOKEN doesn't fire pull_request events (GitHub's anti-loop rule).
on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit refreshed GIFs onto'
        required: false
        default: 'release-please--branches--main--components--json-schema-preview'

# Top-level token is read-only (OSSF Token-Permissions); write scopes are
# granted only to the job that pushes the refreshed GIFs.
permissions:
  contents: read

jobs:
  find-pr:
    # Skip if release-please itself failed (no point refreshing a broken PR).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - name: Resolve target branch
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            branch=$(gh pr list \
              --repo ${{ github.repository }} \
              --state open \
              --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

  # S08-SR-12/13 — which demos changed/are new since the previous release tag,
  # cross-referenced against scripts/demo-registry.mjs. A separate job (needs
  # fetch-depth: 0) since both consumers below share its output.
  detect-features:
    needs: find-pr
    if: needs.find-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.features.outputs.all }}
      demos: ${{ steps.features.outputs.demos }}
      mouse-grep: ${{ steps.features.outputs.mouse-grep }}
      smoke-grep: ${{ steps.features.outputs.smoke-grep }}
      changed-specs: ${{ steps.features.outputs.changed-specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.find-pr.outputs.branch }}
          fetch-depth: 0 # need every tag reachable from HEAD, not just the tip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Detect changed/new feature specs since the previous release
        id: features
        run: node scripts/detect-changed-features.mjs

  refresh-gifs:
    needs: [find-pr, detect-features]
    # Skip entirely if there is no open release-please PR (e.g. the release was
    # just merged — release-please closes the PR and won't have a new one yet).
    if: needs.find-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push refreshed GIFs onto the release-please branch
      statuses: write # post a "Demo GIFs" status on the release-please PR's head commit

    env:
      TARGET_BRANCH: ${{ needs.find-pr.outputs.branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run is decoupled from the release PR's own check list, so
      # this status is the only sign a refresh is running (pending here,
      # success/failure once the job finishes below).
      - name: Mark GIF refresh as pending on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending \
            -f context="Demo GIFs" \
            -f description="Regenerating demo GIFs…" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # canvas falls back to a from-source build when no prebuilt binary
      # matches, hence the headers. ffmpeg/xdotool are for demo-showcase-mouse
      # only, which records the real X11 display (helpers/recorder.ts).
      - name: Install system libraries for canvas, ffmpeg, xdotool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ffmpeg xdotool

      # The extension's preview feature shells out to json-schema-for-humans.
      - name: Install Python preview renderer
        run: pip3 install json-schema-for-humans

      # VS Code (Electron) needs a display on Linux.
      - name: Start virtual display
        run: /usr/bin/Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

      - name: Build extension
        run: npm run compile

      - name: Run E2E tests (capture screenshot frames + showcase recording)
        env:
          DISPLAY: ':99.0'
          ALL: ${{ needs.detect-features.outputs.all }}
          MOUSE_GREP: ${{ needs.detect-features.outputs.mouse-grep }}
        # Only the mouse demos feed GIFs; non-mouse twins run as the e2e-smoke
        # job below instead (S08-SR-11). S08-SR-12: only demos mapped to specs
        # changed since the previous release — `detect-features` falls back to
        # every mouse demo when no previous release tag was resolvable.
        run: |
          if [ "$ALL" = "true" ]; then
            GREP='mouse'
          else
            GREP="$MOUSE_GREP"
          fi
          if [ -z "$GREP" ]; then
            echo "No changed/new feature specs since the previous release — skipping demo capture."
          else
            npx playwright test --config playwright.e2e.config.ts --grep "$GREP"
          fi

      # Failure screenshots/error context and the raw showcase recording —
      # without these a demo timeout is just an opaque TimeoutError in the log.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-results
          path: |
            test-results/
            videos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate demo GIFs
        env:
          ALL: ${{ needs.detect-features.outputs.all }}
          DEMOS: ${{ needs.detect-features.outputs.demos }}
        # `showcase` (no `dir` in scripts/demo-registry.mjs) is excluded here —
        # it's produced by the next step instead.
        run: |
          if [ "$ALL" = "true" ]; then
            node scripts/make-gifs.mjs
          elif [ -n "$DEMOS" ]; then
            node scripts/make-gifs.mjs --demos "$DEMOS"
          else
            echo "No demo GIFs need refreshing."
          fi

      - name: Generate showcase GIF from the screen recording
        if: needs.detect-features.outputs.all == 'true' || contains(needs.detect-features.outputs.demos, 'showcase')
        run: node scripts/make-showcase-gif.mjs

      - name: Commit and push refreshed GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/demo-*.gif
          git diff --staged --quiet || git commit -m "chore: refresh demo GIFs"
          git push origin HEAD:${{ env.TARGET_BRANCH }}

      - name: Mark GIF refresh as successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context="Demo GIFs" \
            -f description="Demo GIFs refreshed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Posts to START_SHA (captured before any changes), not HEAD: a failure
      # here means no GIF commit landed, so HEAD is still that same commit.
      - name: Mark GIF refresh as failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ env.START_SHA }}" \
            -f state=failure \
            -f context="Demo GIFs" \
            -f description="Demo GIFs failed to regenerate — see the workflow run for details" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  e2e-smoke:
    name: E2E UI smoke (Playwright, command-palette demos)
    needs: [find-pr, detect-features]
    # Sibling of refresh-gifs (both need only find-pr/detect-features, not each
    # other) so the two run concurrently instead of one lengthening the
    # other's critical path.
    if: needs.find-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    # S08-SR-10/11 — runs the command-palette (non-mouse) demos through the
    # real VS Code UI; crash/broken-selector detection, no assertions. Not
    # `continue-on-error` (S09-SR-08): that would destroy the only signal this
    # job produces. S08-SR-12: only demos mapped to specs changed since the
    # previous release, falling back to every non-mouse demo otherwise.

    env:
      TARGET_BRANCH: ${{ needs.find-pr.outputs.branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Matches the GIF-refresh environment (preview renders with this when present).
      - name: Install Python renderer
        run: pip3 install json-schema-for-humans

      - name: Build extension bundle
        run: npm run compile

      - name: Start virtual display
        run: /usr/bin/Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

      - name: Run command-palette demo flows (no mouse twins)
        env:
          DISPLAY: ':99.0'
          ALL: ${{ needs.detect-features.outputs.all }}
          SMOKE_GREP: ${{ needs.detect-features.outputs.smoke-grep }}
        run: |
          if [ "$ALL" = "true" ]; then
            npx playwright test --config playwright.e2e.config.ts --grep-invert mouse
          elif [ -n "$SMOKE_GREP" ]; then
            npx playwright test --config playwright.e2e.config.ts --grep "$SMOKE_GREP"
          else
            echo "No changed/new feature specs since the previous release — skipping UI smoke."
          fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
