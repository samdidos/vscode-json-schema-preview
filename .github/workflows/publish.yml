name: Publish

# Packages the extension, attests SLSA build provenance, publishes to the VS
# Code Marketplace, attaches the .vsix to the release, then flips it from
# draft to published — that order matters, since GitHub's immutable-releases
# feature forbids adding assets once a release is published.
#
# `publish` runs under the vscode-marketplace GitHub environment, which
# requires manual approval before any step runs and supplies the OIDC subject
# the Entra ID federated identity credential is scoped to (get-mi-user-id.yml).
#
# Primary trigger is workflow_run, not push:tags — release-please pushes its
# tag with the default GITHUB_TOKEN, and GitHub's anti-recursion rule means
# `push` never fires for that tag (same mechanism refresh-gifs.yml relies
# on). `push` stays as a fallback for a human/PAT-pushed tag.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for backfilling a release the push trigger missed)'
        required: true

permissions:
  contents: read

jobs:
  resolve-tag:
    # workflow_run only tells us release-please ran, not whether it cut a
    # release — derives the tag from the manifest and confirms a matching
    # draft release exists as the actual evidence.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release view`/`list` only return drafts to a token with push access
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the tag to publish
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./.github/release-please/manifest.json')['.']")
            tag="v$version"
            # Retries cover eventual-consistency lag right after
            # release-please creates the release.
            is_draft=""
            for _ in 1 2 3 4 5 6; do
              is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo "")
              if [ "$is_draft" = "true" ]; then break; fi
              sleep 5
            done
            if [ "$is_draft" = "true" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            else
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "No draft release matching manifest version $version — nothing to publish." >&2
            fi
          fi

  publish:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: write # upload the .vsix asset to the release
      id-token: write # OIDC token used to sign the provenance + Marketplace login
      attestations: write # record the SLSA build provenance
      actions: write # dispatch the docs rebuild below
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies -o json-schema-preview.vsix

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: json-schema-preview.vsix

      - name: Login to Microsoft Entra ID with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # only Marketplace/DevOps access is needed, no Azure subscription

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath json-schema-preview.vsix

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" json-schema-preview.vsix --clobber

      # Only reached if packaging/attestation/upload all succeeded — a failed run
      # leaves the release as a draft rather than published-but-incomplete.
      - name: Publish the release (draft -> published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

      # docs/.vitepress/latestRelease.data.ts reads GET /releases/latest,
      # which excludes drafts, and publishing a release pushes no commit — so
      # nothing else would trigger docs.yml (push/workflow_dispatch only).
      - name: Trigger a docs rebuild now that the release is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo ${{ github.repository }} --ref main
