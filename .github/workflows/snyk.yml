name: Snyk (weekly SCA)

# Snyk dependency scan, complementing (not replacing) the Trivy fs scan and
# `npm audit`: a side-by-side test found it catches findings those two miss
# (e.g. SNYK-JS-FASTURI-17675102). Kept off the per-PR path per AGENTS.md's
# agnosticity principle — weekly/on-demand only, not a blocking dependency.
#
# Needs a `SNYK_TOKEN` repository secret; the scan step no-ops via the `if:`
# guard below rather than failing if it's ever removed.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Mondays, 05:00 UTC

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Snyk Open Source test
        # No-op until the SNYK_TOKEN secret is configured (see header).
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test --severity-threshold=high --all-projects
