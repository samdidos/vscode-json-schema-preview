name: Snyk (weekly SCA)

# Snyk Open Source dependency scan, run WEEKLY (and on demand) rather than on
# every PR — deliberately kept off the per-PR critical path, complementing
# rather than replacing the existing Trivy fs scan + `npm audit` (decided
# 2026-07-14 after a live side-by-side test: Snyk caught a High-severity
# fast-uri finding, SNYK-JS-FASTURI-17675102, that both of those missed on
# the same commit — worth keeping as a periodic layer, but not worth the
# vendor/token dependency on the blocking path per AGENTS.md's agnosticity
# principle).
#
# Needs a `SNYK_TOKEN` repository secret (already configured). If that
# secret is ever removed the scan step no-ops via the `if:` guard below
# rather than failing.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Mondays, 05:00 UTC

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Snyk Open Source test
        # No-op until the SNYK_TOKEN secret is configured (see header).
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test --severity-threshold=high --all-projects
