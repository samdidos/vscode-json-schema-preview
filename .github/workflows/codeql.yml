name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    # Skipped on the weekly schedule run (no diff to gate — that run always
    # does a full scan); analyze's `if:` below handles the schedule case
    # separately so this job being skipped doesn't skip analyze too.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Diff against base
        id: filter
        # Same source-relevant path set as ci.yml's `changes` job (S09-SR-02).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base commit (new branch/history rewrite) — running everything."
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE \
              '^(src/|scripts/|package(-lock)?\.json$|webpack\.config\.js$|tsconfig[^/]*\.json$|eslint\.config\.js$|knip\.json$|stryker\.config\.json$|commitlint\.config\.js$|playwright\.e2e\.config\.ts$|\.github/workflows/)'; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (javascript-typescript)
    needs: changes
    # `always()` so a skipped `changes` job (the schedule case) doesn't skip
    # this job too — analyze runs when scheduled, or when changes found a
    # source-relevant diff.
    if: always() && (github.event_name == 'schedule' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:javascript-typescript"
