name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    # Skipped on the weekly schedule run (no diff to gate — that run always
    # does a full scan); analyze's `if:` below handles the schedule case
    # separately so this job being skipped doesn't skip analyze too.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff against base
        id: filter
        # Shares scripts/ci-detect-source-changes.sh with ci.yml's `changes`
        # job (S09-SR-02/S09-NFR-02) — one definition of the path set.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-detect-source-changes.sh

  analyze:
    name: Analyze (javascript-typescript)
    needs: changes
    # `always()` so a skipped `changes` job (the schedule case) doesn't skip
    # this job too — analyze runs when scheduled, or when changes found a
    # source-relevant diff.
    if: always() && (github.event_name == 'schedule' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:javascript-typescript"
