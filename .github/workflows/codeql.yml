name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    # Skipped on the weekly schedule run — that run always does a full scan,
    # so there's no diff to gate. analyze's `always()` below keeps it running
    # even though this job (its `needs:`) was skipped.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff against base
        id: filter
        # Shares scripts/ci-detect-source-changes.sh with ci.yml's `changes`
        # job (S09-SR-02/S09-NFR-02) — one definition of the path set.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-detect-source-changes.sh

  analyze:
    name: Analyze (javascript-typescript)
    needs: changes
    if: always() && (github.event_name == 'schedule' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:javascript-typescript"
