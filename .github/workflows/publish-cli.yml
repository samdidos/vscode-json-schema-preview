name: Publish CLI

# Stages the standalone CLI (F27) — the `json-schema-toolkit` npm package,
# command `jstk` — on npm with build provenance (S21-SR-06).
#
# The CLI shares the extension's version (S21-SR-08). release-please bumps
# cli/package.json, both versions in cli/server.json and MCP_PACKAGE_VERSION in
# src/McpServerDefinition.ts with every release (.github/release-please/
# config.json, `extra-files`), so nothing is bumped by hand. When a release PR
# merges, this workflow stages the CLI from the release tag `v<version>` and,
# once staged, tags the same commit `cli-v<version>`.
#
# The workflow never makes a version live. It logs in with npm trusted
# publishing (OIDC, no stored token) and runs `npm stage publish`, which only
# queues the version; a maintainer then approves it with 2FA, on npmjs.com
# (package → Staged) or with `npm stage approve <stage-id>`. Configure the
# trusted publisher to allow stage publishing only, so a plain `npm publish`
# from here is refused. Runs in the `npm` GitHub environment, whose name the
# trusted publisher is bound to.
#
# Release order: approve the staged CLI before approving the extension's
# Marketplace job (publish.yml), so the version the extension's MCP server
# pins (F33-FR-17) is live by the time the extension is.
#
# MCP Registry (F33-FR-18): the publish-mcp-registry job then lists the same
# version as io.github.samdidos/json-schema-toolkit, from cli/server.json. The
# registry only accepts a version that is live on npm, so the job first checks
# that the staged version was approved and otherwise fails with a reminder —
# approve on npm, then "Re-run failed jobs". It runs in the `mcp-registry`
# environment: add a required reviewer there to have it wait for you instead.
# It logs in with GitHub OIDC (no stored secret).
#
# Triggers:
# - workflow_run after Release Please — the normal path. release-please pushes
#   its tag with GITHUB_TOKEN, which never fires `push` (publish.yml relies on
#   the same mechanism), so the release is detected from the manifest instead.
# - push of a `cli-v*` tag by a person — out-of-band backfill; the tag must
#   match cli/package.json.
# - Run workflow — from any branch; dry_run (default on) builds and validates
#   without staging. A dry run of a version already on npm fails.
on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and validate only — do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve:
    # workflow_run only says release-please ran, not that it cut a release:
    # the release tag pointing at the very commit release-please ran on is the
    # evidence (release-please tags the merged release PR's commit).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      tag_cli: ${{ steps.resolve.outputs.tag_cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve what to stage
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cli_version="$(node -p "require('./cli/package.json').version")"
          case "$EVENT" in
            workflow_run)
              version="$(node -p "require('./.github/release-please/manifest.json')['.']")"
              tag="v$version"
              # The commit the tag names: the peeled entry of an annotated tag,
              # else the lightweight tag itself.
              tag_sha="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
              [ -n "$tag_sha" ] || tag_sha="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
              if [ "$tag_sha" != "$HEAD_SHA" ]; then
                echo "No release cut on this commit (tag $tag -> ${tag_sha:-none}) — nothing to stage."
                echo "ref=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$cli_version" != "$version" ]; then
                echo "::error::cli/package.json is $cli_version but the release is $version; check the extra-files in .github/release-please/config.json (S21-SR-08)." >&2
                exit 1
              fi
              { echo "ref=$tag"; echo "version=$version"; echo "tag_cli=true"; } >> "$GITHUB_OUTPUT"
              ;;
            push)
              version="${GITHUB_REF_NAME#cli-v}"
              if [ "$cli_version" != "$version" ]; then
                echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${cli_version}." >&2
                exit 1
              fi
              { echo "ref=$GITHUB_SHA"; echo "version=$version"; echo "tag_cli=false"; } >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              tag_cli=false
              if [ "$DRY_RUN" != "true" ]; then tag_cli=true; fi
              { echo "ref=$GITHUB_SHA"; echo "version=$cli_version"; echo "tag_cli=$tag_cli"; } >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-cli:
    needs: resolve
    if: needs.resolve.outputs.ref != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token npm uses to sign build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      # `npm stage` needs npm >= 11.15.0. Node 26 bundles a new enough npm, but
      # pin an exact version so the publishing tool cannot change under us.
      - name: Install npm with stage publishing
        run: npm install -g npm@11.21.2

      # Root deps power the webpack build that cli/'s `prepack` runs.
      - run: npm ci

      # `npm stage publish` runs cli/'s `prepack` (npm run build:cli) itself, so
      # the bundle is always built fresh from source here — no committed artifact.
      - name: Stage on npm (or dry-run)
        working-directory: cli
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — building and validating the package without staging it."
            npm stage publish --dry-run --access public
          else
            npm stage publish --provenance --access public
            {
              echo "## json-schema-toolkit@${VERSION} staged"
              echo
              echo "Not live yet. Approve it with 2FA on npmjs.com (json-schema-toolkit → Staged),"
              echo "or run \`npm stage list json-schema-toolkit\` and \`npm stage approve <stage-id>\`."
              echo "Approve it before the extension's Marketplace job, whose MCP server pins this version."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The CLI's own tag on the commit it was staged from (S21-SR-08). A separate
  # job so the OIDC-holding job above never gets write access to the repo. A tag
  # pushed with GITHUB_TOKEN does not trigger the `push` path above again.
  tag-cli:
    needs: [resolve, publish-cli]
    if: needs.resolve.outputs.tag_cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the cli-v* tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Tag cli-v${{ needs.resolve.outputs.version }}
        env:
          TAG: cli-v${{ needs.resolve.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists — leaving it as is."
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  # F33-FR-18 — list the release in the official MCP Registry, once the staged
  # version is live on npm (the registry checks the npm package's mcpName).
  # Never on a dry run. Its own job, so it can be re-run alone after approval.
  publish-mcp-registry:
    needs: [resolve, publish-cli]
    if: needs.resolve.outputs.ref != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write # OIDC token mcp-publisher exchanges for io.github.samdidos/*
    env:
      # The official publisher from modelcontextprotocol/registry releases. Bump
      # deliberately; never fetch `latest` or run a publisher via npx — the
      # unscoped npm name `mcp-publisher` belongs to an unrelated project.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Check the version is live on npm
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          live="$(npm view "json-schema-toolkit@${VERSION}" mcpName 2>/dev/null || true)"
          expected="$(node -p "require('./cli/server.json').name")"
          if [ "$live" != "$expected" ]; then
            echo "::error::json-schema-toolkit@${VERSION} is not live on npm with mcpName ${expected} (got '${live}'). Approve the staged version on npmjs.com (json-schema-toolkit → Staged) or with \`npm stage approve <stage-id>\`, then re-run this job." >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish cli/server.json to the MCP Registry
        working-directory: cli
        run: ../mcp-publisher publish
