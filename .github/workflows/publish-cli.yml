name: Publish CLI

# Stages the standalone CLI (F27) — the `json-schema-toolkit` npm package,
# command `jstk` — on npm with build provenance (S21-SR-06). Independent of the
# extension's release train: its own version (cli/package.json) and its own
# `cli-v*` tags.
#
# The workflow never makes a version live. It logs in with npm trusted
# publishing (OIDC, no stored token) and runs `npm stage publish`, which only
# queues the version; a maintainer then approves it with 2FA, on npmjs.com
# (package → Staged) or with `npm stage approve <stage-id>`. Configure the
# trusted publisher to allow stage publishing only, so a plain `npm publish`
# from here is refused. Runs in the `npm` GitHub environment, whose name the
# trusted publisher is bound to. Test via "Run workflow" with dry_run left on
# (after bumping the version: a dry run of an already published version fails).
#
# Releasing a CLI version: bump `version` in cli/package.json, both versions in
# cli/server.json and MCP_PACKAGE_VERSION in src/McpServerDefinition.ts
# (F33-FR-17; unit tests fail if any of them differ), merge, then push the tag
# `cli-v<version>` and approve the staged version on npm. Publish the extension
# that pins the new version only after that version is live.
on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and validate only — do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token npm uses to sign build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      # `npm stage` needs npm >= 11.15.0. Node 26 bundles a new enough npm, but
      # pin an exact version so the publishing tool cannot change under us.
      - name: Install npm with stage publishing
        run: npm install -g npm@11.21.2

      # Root deps power the webpack build that cli/'s `prepack` runs.
      - run: npm ci

      - name: Verify the tag matches cli/package.json (tag pushes only)
        if: github.event_name == 'push'
        run: |
          pkg="$(node -p "require('./cli/package.json').version")"
          tag="${GITHUB_REF_NAME#cli-v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${pkg}." >&2
            exit 1
          fi

      # `npm stage publish` runs cli/'s `prepack` (npm run build:cli) itself, so
      # the bundle is always built fresh from source here — no committed artifact.
      - name: Stage on npm (or dry-run)
        working-directory: cli
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — building and validating the package without staging it."
            npm stage publish --dry-run --access public
          else
            npm stage publish --provenance --access public
            version="$(node -p "require('./package.json').version")"
            {
              echo "## json-schema-toolkit@${version} staged"
              echo
              echo "Not live yet. Approve it with 2FA on npmjs.com (json-schema-toolkit → Staged),"
              echo "or run \`npm stage list json-schema-toolkit\` and \`npm stage approve <stage-id>\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
